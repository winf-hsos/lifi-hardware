[project]
name = "lifi-hardware"
version = "0.4.2"
description = "Readable interface to the LED and the colour sensor of the LiFi project (Tinkerforge)"
requires-python = ">=3.10"
dependencies = ["tinkerforge>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
